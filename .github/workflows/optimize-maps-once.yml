name: Optimize maps once
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: V2
      - name: Apply phone medium + eco gfx
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path("src/01-core.js")
          t = p.read_text(encoding="utf-8")

          old_eco = "const ECO_GFX = { quality: 'auto', ao: false, rays: false, grass: true, dynres: true };"
          new_eco = "const ECO_GFX = { quality: 'auto', ao: false, rays: false, grass: false, dynres: false };"
          if old_eco not in t:
              print("MISS ECO_GFX")
          else:
              t = t.replace(old_eco, new_eco, 1)
              print("OK ECO_GFX grass/dynres false")

          old_tier = "return { name, tier: ULTRA ? 'ultra' : COARSE ? 'low' : discrete ? 'high' : 'medium' }; // téléphone : on part du plus léger, la résolution dynamique remonte si la puce suit"
          new_tier = "return { name, tier: ULTRA ? 'ultra' : COARSE ? 'medium' : discrete ? 'high' : 'medium' }; // téléphone : Moyenne (eco : ao/rays/grass/dynres off)"
          if old_tier not in t:
              print("MISS GPU.tier")
          else:
              t = t.replace(old_tier, new_tier, 1)
              print("OK phone tier medium")

          # comments
          t2 = t.replace(
              "téléphone : Basse, puce intégrée : Moyenne, carte dédiée : Haute",
              "téléphone : Moyenne, puce intégrée : Moyenne, carte dédiée : Haute",
              1,
          )
          if t2 != t:
              t = t2
              print("OK comment appareil")
          t2 = t.replace(
              "téléphone → Basse, rendu logiciel",
              "téléphone → Moyenne, rendu logiciel",
              1,
          )
          if t2 != t:
              t = t2
              print("OK comment profil départ")
          t2 = t.replace(
              "ni occlusion ambiante ni rayons du soleil (deux passes plein écran) ; l'herbe\n   en relief reste, allégée par le profil.",
              "ni occlusion ambiante, ni rayons du soleil, ni herbe en relief, ni résolution dynamique.",
              1,
          )
          if t2 != t:
              t = t2
              print("OK comment eco gfx")

          p.write_text(t, encoding="utf-8")
          assert "COARSE ? 'medium'" in p.read_text(encoding="utf-8")
          assert "grass: false, dynres: false" in p.read_text(encoding="utf-8")
          print("DONE")
          PY
      - name: Commit if changed
        run: |
          git config user.name "Danny78"
          git config user.email "danielmendesdacosta78@gmail.com"
          git add src/01-core.js
          if git diff --staged --quiet; then
            echo "Nada a commitar"
          else
            git commit -m "Perf V2: telemóveis partem medium; eco ao/rays/grass/dynres off"
            git push origin HEAD:V2
          fi
