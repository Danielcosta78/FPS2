name: Optimize maps once

on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: V2
      - name: Restore original video/eco defaults
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re
          p = Path("src/01-core.js")
          t = p.read_text(encoding="utf-8")

          t = t.replace(
              "quality: 'auto', dynres: false, eco: null, fpsMax: '0', perf: false, ao: false, rays: false, grass: false,",
              "quality: 'auto', dynres: true, eco: null, fpsMax: '0', perf: false, ao: false, rays: true, grass: true,",
              1,
          )
          t = t.replace(
              "/* Téléphone / tablette : même sans économie d'énergie, AO, rayons, herbe et résolution dynamique partent coupés */\nif (COARSE) { Settings.ao = false; Settings.rays = false; Settings.grass = false; Settings.dynres = false; }\n",
              "",
              1,
          )
          t = t.replace(
              "if (Settings.eco !== true && Settings.eco !== false) { Settings.eco = COARSE; Settings.ecoAsk = COARSE; }\nif (Settings.eco) { Settings.ao = false; Settings.rays = false; Settings.grass = false; Settings.dynres = false; }\n",
              "if (Settings.eco !== true && Settings.eco !== false) { Settings.eco = COARSE; Settings.ecoAsk = COARSE; }\n",
              1,
          )
          t = t.replace(
              "const ECO_GFX = { quality: 'auto', ao: false, rays: false, grass: false, dynres: false };",
              "const ECO_GFX = { quality: 'auto', ao: false, rays: false, grass: true, dynres: true };",
              1,
          )
          t = t.replace(
              "return { name, tier: ULTRA ? 'ultra' : COARSE ? 'medium' : discrete ? 'high' : 'medium' }; // téléphone : Moyenne (eco : ao/rays/grass/dynres off)",
              "return { name, tier: ULTRA ? 'ultra' : COARSE ? 'low' : discrete ? 'high' : 'medium' }; // téléphone : on part du plus léger, la résolution dynamique remonte si la puce suit",
              1,
          )
          t = t.replace("téléphone : Moyenne, puce intégrée", "téléphone : Basse, puce intégrée", 1)
          t = t.replace("téléphone → Moyenne, rendu logiciel", "téléphone → Basse, rendu logiciel", 1)
          t = re.sub(
              r"/\* Téléphone : une fois \(sv < 9\).*?saveSettings\(\);\n\}\n",
              "",
              t,
              count=1,
              flags=re.S,
          )
          # fix eco comment if broken
          t = t.replace(
              "ni occlusion ambiante, ni rayons du soleil, ni herbe en relief, ni résolution dynamique.",
              "ni occlusion ambiante ni rayons du soleil (deux passes plein écran) ; l'herbe\n   en relief reste, allégée par le profil.",
              1,
          )
          p.write_text(t, encoding="utf-8")
          assert "rays: true, grass: true" in t
          assert "grass: true, dynres: true" in t
          assert "COARSE ? 'low'" in t
          assert "sv < 9" not in t
          print("RESTORED")
          PY
      - name: Commit
        run: |
          git config user.name "Danny78"
          git config user.email "danielmendesdacosta78@gmail.com"
          git add src/01-core.js
          if git diff --staged --quiet; then echo none; else git commit -m "V2: repor defaults de vídeo e eco originais" && git push origin HEAD:V2; fi
