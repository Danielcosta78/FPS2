name: Optimize maps once
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: V2
      - name: Force phone video defaults
        run: |
          python3 << 'PY'
          from pathlib import Path

          # --- 01-core.js: migration sv 9 after saveSettings ---
          p = Path("src/01-core.js")
          t = p.read_text(encoding="utf-8")
          old = "function saveSettings() { try { localStorage.setItem('dc_settings', JSON.stringify(Settings)); } catch (e) { /* ignoré */ } }\n/* Mode graphique économique"
          new = "function saveSettings() { try { localStorage.setItem('dc_settings', JSON.stringify(Settings)); } catch (e) { /* ignoré */ } }\n/* Téléphone : une fois (sv < 9), AO / rayons / herbe / rés. dynamique restent coupés même si d'anciens réglages les avaient allumés */\nif (COARSE && Settings.sv < 9) {\n  Settings.ao = false; Settings.rays = false; Settings.grass = false; Settings.dynres = false; Settings.sv = 9; saveSettings();\n}\n/* Mode graphique économique"
          if old not in t:
              print("MISS saveSettings anchor")
          else:
              t = t.replace(old, new, 1)
              print("OK migration sv9")
          p.write_text(t, encoding="utf-8")

          # --- 09zl-economie.js: ao desligar eco no telemóvel, manter toggles off ---
          p2 = Path("src/09zl-economie.js")
          t2 = p2.read_text(encoding="utf-8")
          old2 = "const was = Settings.eco; Settings.eco = on; Settings.ecoAsk = false; saveSettings(); syncOptions(); if (was !== on) ecoApply();"
          new2 = "const was = Settings.eco; Settings.eco = on; Settings.ecoAsk = false;\n  if (!on && typeof COARSE !== 'undefined' && COARSE) { Settings.ao = false; Settings.rays = false; Settings.grass = false; Settings.dynres = false; }\n  saveSettings(); syncOptions(); if (was !== on) ecoApply();"
          if old2 not in t2:
              print("MISS ecoClose")
          else:
              t2 = t2.replace(old2, new2, 1)
              print("OK ecoClose phone defaults")
          p2.write_text(t2, encoding="utf-8")

          assert "Settings.sv < 9" in Path("src/01-core.js").read_text(encoding="utf-8")
          assert "if (!on && typeof COARSE" in Path("src/09zl-economie.js").read_text(encoding="utf-8")
          print("DONE")
          PY
      - name: Commit if changed
        run: |
          git config user.name "Danny78"
          git config user.email "danielmendesdacosta78@gmail.com"
          git add src/01-core.js src/09zl-economie.js
          if git diff --staged --quiet; then
            echo "Nada a commitar"
          else
            git commit -m "V2: forçar ao/rays/grass/dynres off no telemóvel (migração sv9 + ao recusar eco)"
            git push origin HEAD:V2
          fi
