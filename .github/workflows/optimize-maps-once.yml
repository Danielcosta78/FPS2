name: Optimize maps once
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: V2
      - name: Apply grass range 65%
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path("src/01-core.js")
          t = p.read_text(encoding="utf-8")
          reps = [
              ("grass: [0.55, 22, 8]", "grass: [0.55, 14, 5]"),
              ("grass: [0.45, 18, 7]", "grass: [0.45, 12, 5]"),
              ("grass: [0.35, 15, 6]", "grass: [0.35, 10, 4]"),
              ("grass: [0.3, 12, 5]", "grass: [0.3, 8, 3]"),
          ]
          t2 = t
          for a, b in reps:
              if a not in t2:
                  print(f"nao encontrado: {a}")
              else:
                  t2 = t2.replace(a, b, 1)
                  print(f"ok: {a} -> {b}")
          if t2 == t:
              print("sem alteracoes")
          else:
              p.write_text(t2, encoding="utf-8")
              print("QUALITY grass range atualizado (65%)")
          PY
      - name: Commit if changed
        run: |
          git config user.name "Danny78"
          git config user.email "danielmendesdacosta78@gmail.com"
          git add src/01-core.js
          if git diff --staged --quiet; then
            echo "Nada a commitar"
          else
            git commit -m "Erva: alcance a 65% (high 14m, medium 12m, low 8m)"
            git push origin HEAD:V2
          fi
