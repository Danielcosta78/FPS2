name: Optimize maps once

on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: V2
      - name: Phone tier medium
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path("src/01-core.js")
          t = p.read_text(encoding="utf-8")
          old = "return { name, tier: ULTRA ? 'ultra' : COARSE ? 'low' : discrete ? 'high' : 'medium' }; // téléphone : on part du plus léger, la résolution dynamique remonte si la puce suit"
          new = "return { name, tier: ULTRA ? 'ultra' : COARSE ? 'medium' : discrete ? 'high' : 'medium' }; // téléphone : Moyenne"
          if old not in t:
              print("MISS", "COARSE ? 'low'" in t, "COARSE ? 'medium'" in t)
          else:
              t = t.replace(old, new, 1)
              print("OK medium")
          t = t.replace("téléphone : Basse, puce intégrée", "téléphone : Moyenne, puce intégrée", 1)
          t = t.replace("téléphone → Basse, rendu logiciel", "téléphone → Moyenne, rendu logiciel", 1)
          p.write_text(t, encoding="utf-8")
          assert "COARSE ? 'medium'" in p.read_text(encoding="utf-8")
          print("DONE")
          PY
      - name: Commit
        run: |
          git config user.name "Danny78"
          git config user.email "danielmendesdacosta78@gmail.com"
          git add src/01-core.js
          if git diff --staged --quiet; then echo none; else git commit -m "V2: telemóveis partem em medium no modo automático" && git push origin HEAD:V2; fi
