name: Optimize maps once

on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: V2
      - name: Patch core defaults
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path("src/01-core.js")
          t = p.read_text(encoding="utf-8")
          a = "quality: 'auto', dynres: true, eco: null, fpsMax: '0', perf: false, ao: false, rays: true, grass: true,"
          b = "quality: 'auto', dynres: false, eco: null, fpsMax: '0', perf: false, ao: false, rays: false, grass: false,"
          if a in t:
              t = t.replace(a, b, 1)
              print("defaults ok")
          else:
              print("defaults skip", "dynres: false" in t and "rays: false" in t)
          needle = "if (Settings.eco !== true && Settings.eco !== false) { Settings.eco = COARSE; Settings.ecoAsk = COARSE; }"
          mirror = "if (Settings.eco) { Settings.ao = false; Settings.rays = false; Settings.grass = false; Settings.dynres = false; }"
          if mirror not in t and needle in t:
              t = t.replace(needle, needle + "\n" + mirror, 1)
              print("mirror ok")
          elif mirror in t:
              print("mirror exists")
          else:
              print("mirror miss")
          p.write_text(t, encoding="utf-8")
          PY
      - name: Commit
        run: |
          git config user.name "Danny78"
          git config user.email "danielmendesdacosta78@gmail.com"
          git add src/01-core.js
          if git diff --staged --quiet; then echo none; else git commit -m "V2: defaults rays/grass/dynres false; eco mirror into Settings" && git push origin HEAD:V2; fi
