name: Optimize maps once
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: V2
      - name: Phone Settings defaults
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path("src/01-core.js")
          t = p.read_text(encoding="utf-8")
          old = "const Settings = { binds: {}, touch: 'auto', tcRun: 'stick', tcStick: 'float', tcLay: null, aimAssist: 'normal', tpMode: 'auto', tpSeen: false, tpHint: false, tpAuto: true, tpDblAds: true, adsToggle: false, tcAuto: true, tcDblAds: true, tcQuick: true, tcVib: true, tcAlpha: '1', tcV: 0, gfxSafe: false, gfxSafeAuto: '', padSeen: false, padSens: 1.0, padAdsMul: 0.65, adsMul: 1.0, padDead: 0.1, padCurve: 'reactive', padAccel: 'normal', padRun: 'click', padLay: 'default', padVib: true, sens: 1.0, fov: 62, quality: 'auto', dynres: true, eco: null, fpsMax: '0', perf: false, ao: false, rays: true, grass: true, difficulty: 2, loadout: 0, mode: 'tdm', limit: 75, limitFfa: 20, limitDom: 150, minutes: 10, map: 'sable', volume: 0.8, music: 0.5, voice: true, nadeArc: true, invertY: false, fsGame: false, allyMarks: true, hudScale: '1', skin: 'assault', lang: 'auto', sv: 8 };\ntry {"
          new = "const Settings = { binds: {}, touch: 'auto', tcRun: 'stick', tcStick: 'float', tcLay: null, aimAssist: 'normal', tpMode: 'auto', tpSeen: false, tpHint: false, tpAuto: true, tpDblAds: true, adsToggle: false, tcAuto: true, tcDblAds: true, tcQuick: true, tcVib: true, tcAlpha: '1', tcV: 0, gfxSafe: false, gfxSafeAuto: '', padSeen: false, padSens: 1.0, padAdsMul: 0.65, adsMul: 1.0, padDead: 0.1, padCurve: 'reactive', padAccel: 'normal', padRun: 'click', padLay: 'default', padVib: true, sens: 1.0, fov: 62, quality: 'auto', dynres: true, eco: null, fpsMax: '0', perf: false, ao: false, rays: true, grass: true, difficulty: 2, loadout: 0, mode: 'tdm', limit: 75, limitFfa: 20, limitDom: 150, minutes: 10, map: 'sable', volume: 0.8, music: 0.5, voice: true, nadeArc: true, invertY: false, fsGame: false, allyMarks: true, hudScale: '1', skin: 'assault', lang: 'auto', sv: 8 };\n/* Téléphone / tablette : même sans économie d'énergie, AO, rayons, herbe et résolution dynamique partent coupés */\nif (COARSE) { Settings.ao = false; Settings.rays = false; Settings.grass = false; Settings.dynres = false; }\ntry {"
          if old not in t:
              print("MISS Settings block")
          else:
              t = t.replace(old, new, 1)
              print("OK phone Settings defaults")
          p.write_text(t, encoding="utf-8")
          assert "if (COARSE) { Settings.ao = false; Settings.rays = false; Settings.grass = false; Settings.dynres = false; }" in p.read_text(encoding="utf-8")
          print("DONE")
          PY
      - name: Commit if changed
        run: |
          git config user.name "Danny78"
          git config user.email "danielmendesdacosta78@gmail.com"
          git add src/01-core.js
          if git diff --staged --quiet; then
            echo "Nada a commitar"
          else
            git commit -m "V2: telemóvel defaults ao/rays/grass/dynres false mesmo sem eco"
            git push origin HEAD:V2
          fi
