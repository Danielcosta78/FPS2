name: Construir o jogo
on:
  push:
    branches: [main]
    paths: ['src/**', 'shell.html', 'build.py', 'i18n/**', 'assets/**', 'changelog.json']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 build.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dist docs
          git diff --cached --quiet || (git commit -m "dist: reconstruído a partir de src/" && git push)
